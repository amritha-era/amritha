  if(!still){t+=.006}
  tx+=((mp?(mp[0]/W-.5)*2:0)-tx)*.04;
  const cs=getComputedStyle(de),ink=cs.getPropertyValue("--ink").trim(),brass=cs.getPropertyValue("--brass").trim(),P=V.map(proj);
  hov=-1;if(mp){let m=22;P.forEach((p,i)=>{const d=Math.hypot(p[0]-mp[0],p[1]-mp[1]);if(d<m){m=d;hov=i}})}
  cx.clearRect(0,0,W,H);
  E.forEach(([i,j])=>{const on=hov>=0&&(i===hov||j===hov);cx.strokeStyle=on?brass:ink;cx.globalAlpha=on?1:.3;cx.lineWidth=on?2.2:1;cx.beginPath();cx.moveTo(P[i][0],P[i][1]);cx.lineTo(P[j][0],P[j][1]);cx.stroke()});
  P.forEach((p,i)=>{const nb=hov>=0&&(i===hov||[0,1,2,3].some(k=>(hov^1<<k)===i));cx.fillStyle=nb?brass:ink;cx.globalAlpha=nb?1:.6;cx.beginPath();cx.arc(p[0],p[1],(i===hov?7:nb?5.5:3.5)*p[2]*1.8,0,7);cx.fill()});
  if(hov>=0){cx.globalAlpha=1;cx.fillStyle=brass;cx.font="600 18px 'Cormorant Garamond',serif";cx.fillText(hov.toString(2).padStart(4,"0"),P[hov][0]+12,P[hov][1]-10)}
  cx.globalAlpha=1;if(!still)requestAnimationFrame(frame)}
function pos(e){const r=cv.getBoundingClientRect();mp=[e.clientX-r.left,e.clientY-r.top];if(still)frame()}
cv.addEventListener("pointermove",pos);cv.addEventListener("pointerleave",()=>{mp=null;if(still)frame()});
btn.addEventListener("click",()=>{if(still)frame()});
addEventListener("resize",()=>{size();if(still)frame()});size();frame();
// lattice background
const lc=$("lat"),lx=lc.getContext("2d");
let LW=1,LH=1,lm=null,lt=0;
function lsize(){const d=devicePixelRatio||1;LW=innerWidth;LH=innerHeight;lc.width=LW*d;lc.height=LH*d;lx.setTransform(d,0,0,d,0,0)}
function cdraw(){
  const cs=getComputedStyle(de),ink=cs.getPropertyValue("--ink").trim(),brass=cs.getPropertyValue("--brass").trim();
  const n=220,R=Math.min(LW,LH)*.46,ox=LW/2,oy=LH/2;
  const m=21-19*Math.cos(lt*.5)+(lm?(lm[0]/LW-.5)*4:0);
  const pt=k=>{const a=2*Math.PI*k/n-Math.PI/2;return[ox+R*Math.cos(a),oy+R*Math.sin(a)]};
  lx.clearRect(0,0,LW,LH);
  lx.strokeStyle=ink;lx.globalAlpha=.13;lx.lineWidth=.8;lx.beginPath();
  for(let i=0;i<n;i++){const a=pt(i),b=pt((i*m)%n);lx.moveTo(a[0],a[1]);lx.lineTo(b[0],b[1])}
  lx.stroke();
  lx.strokeStyle=brass;lx.globalAlpha=.35;lx.lineWidth=1.2;lx.beginPath();lx.arc(ox,oy,R,0,7);lx.stroke();
  lx.fillStyle=brass;lx.globalAlpha=.5;lx.font="italic 500 16px 'Cormorant Garamond',serif";
  lx.fillText("k → "+m.toFixed(2)+"·k  (mod "+n+")",24,LH-24);
  lx.globalAlpha=1}
function ldraw(){
if(de.dataset.theme!=="dark"){lx.clearRect(0,0,LW,LH);return}
  const cs=getComputedStyle(de),ink=cs.getPropertyValue("--ink").trim(),brass=cs.getPropertyValue("--brass").trim();
  const th=.38+Math.sin(lt)*.07,s=46,b1=[s*Math.cos(th),s*Math.sin(th)],b2=[-16+Math.sin(lt*.7)*6,42];
  const ox=LW/2,oy=LH/2,N=Math.ceil(Math.hypot(LW,LH)/70)+2;
  lx.clearRect(0,0,LW,LH);lx.fillStyle=ink;
  for(let i=-N;i<=N;i++)for(let j=-N;j<=N;j++){
    let x=ox+i*b1[0]+j*b2[0],y=oy+i*b1[1]+j*b2[1];
    if(x<-20||x>LW+20||y<-20||y>LH+20)continue;
    let r=1.3,al=.22;
    if(lm){const dx=lm[0]-x,dy=lm[1]-y,dd=Math.hypot(dx,dy);if(dd<150){const k=1-dd/150;x+=dx*k*.22;y+=dy*k*.22;r=1.3+k*2.2;al=.22+k*.5}}
    lx.globalAlpha=al;lx.beginPath();lx.arc(x,y,r,0,7);lx.fill()}
  if(lm){
    const det=b1[0]*b2[1]-b1[1]*b2[0],px=lm[0]-ox,py=lm[1]-oy,
      u=(px*b2[1]-py*b2[0])/det,v=(b1[0]*py-b1[1]*px)/det,i=Math.floor(u),j=Math.floor(v),
      q=(a,b)=>[ox+a*b1[0]+b*b2[0],oy+a*b1[1]+b*b2[1]],P=[q(i,j),q(i+1,j),q(i+1,j+1),q(i,j+1)];
    lx.beginPath();P.forEach((p,k)=>k?lx.lineTo(p[0],p[1]):lx.moveTo(p[0],p[1]));lx.closePath();
    lx.globalAlpha=.1;lx.fillStyle=brass;lx.fill();
    lx.globalAlpha=.7;lx.strokeStyle=brass;lx.lineWidth=1;lx.stroke()}
  lx.globalAlpha=1}
function lloop(){lt+=.004;ldraw();requestAnimationFrame(lloop)}
document.addEventListener("pointermove",e=>{lm=[e.clientX,e.clientY];if(still)ldraw()});
de.addEventListener("pointerleave",()=>{lm=null;if(still)ldraw()});
addEventListener("resize",()=>{lsize();if(still)ldraw()});
btn.addEventListener("click",()=>{if(still)ldraw()});
lsize();
})();
