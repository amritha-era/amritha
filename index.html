<style>

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

(function(){

const nav=$("nav"),root=$("sections");
secs.forEach(([id,title,build,show])=>{if(show===0)return;

function proj(v){let[x,y,z,u]=v,a=t,b=t*.7+tx,c=Math.cos(a),s=Math.sin(a);[x,z]=[x*c-z*s,x*s+z*c];c=Math.cos(b);s=Math.sin(b);[y,u]=[y*c-u*s,y*s+u*c];

  hov=-1;if(mp){let m=22;P.forEach((p,i)=>{const d=Math.hypot(p[0]-mp[0],p[1]-mp[1]);if(d<m){m=d;hov=i}})}
  cx.clearRect(0,0,W,H);
  E.forEach(([i,j])=>{const on=hov>=0&&(i===hov||j===hov);cx.strokeStyle=on?brass:ink;cx.globalAlpha=on?1:.3;cx.lineWidth=on?2.2:1;cx.beginPath();cx.moveTo(P[i][0],P[i][1]);cx.lineTo(P[j][0],P[j][1]);cx.stroke()});
  P.forEach((p,i)=>{const nb=hov>=0&&(i===hov||[0,1,2,3].some(k=>(hov^1<<k)===i));cx.fillStyle=nb?brass:ink;cx.globalAlpha=nb?1:.6;cx.beginPath();cx.arc(p[0],p[1],(i===hov?7:nb?5.5:3.5)*p[2]*1.8,0,7);cx.fill()});
